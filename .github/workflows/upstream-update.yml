name: Check SpotConnect upstream

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: spotconnect-upstream-update
  cancel-in-progress: false

jobs:
  check:
    name: Check for a new stable release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Check latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(tr -d '[:space:]' < .upstream-version)"
          latest="$(gh api repos/philippe44/SpotConnect/releases/latest --jq .tag_name)"
          if [[ ! "${latest}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected upstream tag: ${latest}" >&2
            exit 1
          fi
          if [[ "${latest}" == "${current}" ]]; then
            echo "update=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          newest="$(printf '%s\n%s\n' "${current}" "${latest}" | sort -V | tail -n1)"
          if [[ "${newest}" != "${latest}" ]]; then
            echo "Latest release ${latest} is older than pinned ${current}; ignoring"
            echo "update=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "update=true" >> "${GITHUB_OUTPUT}"
          echo "current=${current}" >> "${GITHUB_OUTPUT}"
          echo "latest=${latest}" >> "${GITHUB_OUTPUT}"

      - name: Download and verify release archive
        if: steps.release.outputs.update == 'true'
        id: archive
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.release.outputs.latest }}
        run: |
          url="https://github.com/philippe44/SpotConnect/releases/download/${LATEST}/SpotConnect-${LATEST}.zip"
          if ! curl --fail --location --retry 3 --output /tmp/spotconnect.zip "${url}"; then
            title="SpotConnect ${LATEST} release archive is unavailable"
            existing="$(gh issue list --state open --search "${title} in:title" --json number --jq '.[0].number // empty')"
            if [[ -z "${existing}" ]]; then
              gh issue create --assignee "${GITHUB_REPOSITORY_OWNER}" --title "${title}" --body "The automated update found release ${LATEST}, but its expected archive could not be downloaded from ${url}. Please inspect the upstream release."
            fi
            exit 1
          fi
          checksum="$(sha256sum /tmp/spotconnect.zip | cut -d ' ' -f1)"
          echo "checksum=${checksum}" >> "${GITHUB_OUTPUT}"

      - name: Prepare update commit
        if: steps.release.outputs.update == 'true'
        env:
          CURRENT: ${{ steps.release.outputs.current }}
          LATEST: ${{ steps.release.outputs.latest }}
          CHECKSUM: ${{ steps.archive.outputs.checksum }}
        run: |
          printf '%s\n' "${LATEST}" > .upstream-version
          sed -Ei "s/^(ARG SPOTCONNECT_VERSION=).*/\1${LATEST}/" spotconnect/Dockerfile
          sed -Ei "s/^(ARG SPOTCONNECT_SHA256=).*/\1${CHECKSUM}/" spotconnect/Dockerfile
          sed -Ei "s/^version: \".*\"/version: \"${LATEST}-1\"/" spotconnect/config.yaml
          sed -i "3i\\
          ## ${LATEST}-1\\
          \\
          - Update SpotConnect from ${CURRENT} to ${LATEST}.\\
          " spotconnect/CHANGELOG.md
          ./tests/validate.sh

      - name: Push update branch and open pull request
        if: steps.release.outputs.update == 'true'
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT: ${{ steps.release.outputs.current }}
          LATEST: ${{ steps.release.outputs.latest }}
        run: |
          branch="automation/spotconnect-${LATEST}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git add .upstream-version spotconnect/Dockerfile spotconnect/config.yaml spotconnect/CHANGELOG.md
          git commit -m "Update SpotConnect to ${LATEST}"
          git fetch origin "${branch}:refs/remotes/origin/${branch}" || true
          if ! git push --force-with-lease origin "HEAD:refs/heads/${branch}"; then
            title="Update SpotConnect to ${LATEST}"
            existing="$(gh issue list --state open --search "${title} in:title" --json number --jq '.[0].number // empty')"
            if [[ -z "${existing}" ]]; then
              gh issue create --assignee "${GITHUB_REPOSITORY_OWNER}" --title "${title}" --body "SpotConnect ${LATEST} is available, but the automated workflow could not push its prepared update branch. Please update from ${CURRENT} manually and inspect the failed workflow run."
            fi
            exit 1
          fi
          pr_number="$(gh pr list --state open --head "${branch}" --json number --jq '.[0].number // empty')"
          if [[ -z "${pr_number}" ]]; then
            if ! gh pr create \
              --base main \
              --head "${branch}" \
              --title "Update SpotConnect to ${LATEST}" \
              --body "Updates the pinned upstream release from ${CURRENT} to ${LATEST}, refreshes the verified archive checksum, and resets the packaging revision.\n\nUpstream release: https://github.com/philippe44/SpotConnect/releases/tag/${LATEST}"; then
              title="SpotConnect ${LATEST} update branch is ready"
              existing="$(gh issue list --state open --search "${title} in:title" --json number --jq '.[0].number // empty')"
              if [[ -z "${existing}" ]]; then
                gh issue create --assignee "${GITHUB_REPOSITORY_OWNER}" --title "${title}" --body "The workflow prepared and pushed branch \`${branch}\`, but repository policy prevented it from opening a pull request. Create the PR manually."
              fi
              exit 1
            fi
            pr_number="$(gh pr list --state open --head "${branch}" --json number --jq '.[0].number')"
          fi
          echo "pr_number=${pr_number}" >> "${GITHUB_OUTPUT}"
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"

      - name: Validate update on all supported architectures
        if: steps.release.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.update.outputs.branch }}
          LATEST: ${{ steps.release.outputs.latest }}
          PR_NUMBER: ${{ steps.update.outputs.pr_number }}
        run: |
          old_lint_id="$(gh run list --workflow lint.yml --branch "${BRANCH}" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          old_build_id="$(gh run list --workflow build.yml --branch "${BRANCH}" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          gh workflow run lint.yml --ref "${BRANCH}"
          gh workflow run build.yml --ref "${BRANCH}"

          failed=false
          for workflow_and_previous in "lint.yml:${old_lint_id}" "build.yml:${old_build_id}"; do
            workflow="${workflow_and_previous%%:*}"
            previous_id="${workflow_and_previous#*:}"
            run_id=""
            for _ in $(seq 1 30); do
              run_id="$(gh run list \
                --workflow "${workflow}" \
                --branch "${BRANCH}" \
                --event workflow_dispatch \
                --limit 1 \
                --json databaseId \
                --jq '.[0].databaseId // empty')"
              if [[ -n "${run_id}" && "${run_id}" != "${previous_id}" ]]; then
                break
              fi
              run_id=""
              sleep 5
            done

            if [[ -z "${run_id}" ]] || ! gh run watch "${run_id}" --exit-status; then
              failed=true
            fi
          done

          if [[ "${failed}" == "true" ]]; then
            body="The prepared update in PR #${PR_NUMBER} failed its Home Assistant lint or multi-architecture build. The PR was left open for inspection."
            gh pr comment "${PR_NUMBER}" --body "${body}"
            exit 1
          fi

      - name: Merge verified update
        if: steps.release.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.update.outputs.pr_number }}
        run: gh pr merge "${PR_NUMBER}" --squash --delete-branch

      # GITHUB_TOKEN merges do not trigger push workflows. Dispatch explicitly.
      - name: Publish merged update and wait for completion
        if: steps.release.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 30
        run: |
          previous_id="$(gh run list --workflow build.yml --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          gh workflow run build.yml --ref main
          run_id=""
          for _ in $(seq 1 30); do
            run_id="$(gh run list --workflow build.yml --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            if [[ -n "${run_id}" && "${run_id}" != "${previous_id}" ]]; then
              break
            fi
            run_id=""
            sleep 5
          done
          test -n "${run_id}"
          gh run watch "${run_id}" --exit-status

      - name: Verify current published image even when upstream is unchanged
        run: |
          version="$(sed -n 's/^version: "\([^"]*\)"/\1/p' spotconnect/config.yaml)"
          docker manifest inspect "ghcr.io/allcrafter1/ha-spotconnect:${version}" > /tmp/spotconnect-manifest.json
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | (index("amd64") != null and index("arm64") != null)' /tmp/spotconnect-manifest.json

      - name: Notify owner about a published version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^version: "\([^"]*\)"/\1/p' spotconnect/config.yaml)"
          title="SpotConnect ${version} is available"
          existing="$(gh issue list --state all --search "${title} in:title" --json title | jq -r --arg title "${title}" '.[] | select(.title == $title) | .title')"
          if [[ -z "${existing}" ]]; then
            printf 'SpotConnect %s has been published. The image is available for amd64 and aarch64. You can install or update the app through Home Assistant.\n\nImage: ghcr.io/allcrafter1/ha-spotconnect:%s\n' "${version}" "${version}" > /tmp/spotconnect-notification.md
            gh issue create --assignee "${GITHUB_REPOSITORY_OWNER}" --title "${title}" --body-file /tmp/spotconnect-notification.md
          fi

      # Dependabot cannot resolve our ARG-based FROM, so query GHCR directly.
      - name: Notify owner about a newer base image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(sed -n 's/^ARG BUILD_FROM=ghcr.io\/home-assistant\/base://p' spotconnect/Dockerfile)"
          token="$(curl --fail --silent --show-error --retry 3 'https://ghcr.io/token?service=ghcr.io&scope=repository:home-assistant/base:pull' | jq -er .token)"
          tags="$(curl --fail --silent --show-error --retry 3 -H "Authorization: Bearer ${token}" https://ghcr.io/v2/home-assistant/base/tags/list)"
          latest="$(jq -r '.tags[] | select(test("^[0-9]+\\.[0-9]+(\\.[0-9]+)?$"))' <<< "${tags}" | sort -V | tail -n1)"
          test -n "${latest}"
          newest="$(printf '%s\n%s\n' "${current}" "${latest}" | sort -V | tail -n1)"
          if [[ "${latest}" == "${current}" || "${newest}" != "${latest}" ]]; then
            exit 0
          fi
          title="SpotConnect base image ${latest} is available"
          existing="$(gh issue list --state all --search "${title} in:title" --json title | jq -r --arg title "${title}" '.[] | select(.title == $title) | .title')"
          if [[ -z "${existing}" ]]; then
            printf 'A newer Home Assistant base image is available: ghcr.io/home-assistant/base:%s (currently %s). Review compatibility, update BUILD_FROM, and bump the app packaging version before publishing.\n' "${latest}" "${current}" > /tmp/spotconnect-base-notification.md
            gh issue create --assignee "${GITHUB_REPOSITORY_OWNER}" --title "${title}" --body-file /tmp/spotconnect-base-notification.md
          fi

      - name: Create issue when update automation fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="SpotConnect upstream automation needs attention"
          existing="$(gh issue list --state open --search "${title} in:title" --json number --jq '.[0].number // empty')"
          if [[ -z "${existing}" ]]; then
            gh issue create \
              --assignee "${GITHUB_REPOSITORY_OWNER}" \
              --title "${title}" \
              --body "The SpotConnect update or publication check failed. An update may already be merged while its image is unavailable. Inspect the failed run before retrying installation: ${RUN_URL}"
          else
            gh issue comment "${existing}" --body "The automatic update workflow failed again: ${RUN_URL}"
          fi
